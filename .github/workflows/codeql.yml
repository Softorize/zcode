name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 03:17 UTC scan to catch drift.
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Zig is not a CodeQL-supported language, so scan the
        # JS-heavy VS Code extension source and the GitHub Actions
        # workflow files directly. The Zig core is covered by its
        # own unit + integration + fuzz coverage.
        include:
          - language: javascript-typescript
          - language: actions
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          category: "/language:${{ matrix.language }}"
          # GitHub Advanced Security is not enabled on this repository,
          # so SARIF cannot be uploaded to the Security tab. The analysis
          # still runs and surfaces findings in workflow logs. Enable
          # Advanced Security on the repo to flip this back to default.
          upload: never
