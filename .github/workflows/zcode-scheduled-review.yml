name: zcode-scheduled-review

on:
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scheduled-review:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZCODE_PROVIDER: openai
      ZCODE_SCHEDULED_REVIEW_TARGET: working
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - id: review
        shell: bash
        run: |
          output="$(bash scripts/github/scheduled_review.sh)"
          {
            echo "body<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ZCODE_REVIEW: ${{ steps.review.outputs.body }}
        with:
          script: |
            const body = process.env.ZCODE_REVIEW || "zcode scheduled review produced no output.";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `zcode scheduled review ${new Date().toISOString().slice(0, 10)}`,
              body: `## zcode scheduled review\n\n${body}`
            });
